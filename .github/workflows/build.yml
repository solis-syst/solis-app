name: Build Solis

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Prepare downloadable installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstaller" } |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "No Windows installer EXE was produced in dist/."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $installer.FullName "artifact/Solis-Setup.exe"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solis-Windows-Installer
          path: artifact/Solis-Setup.exe
          if-no-files-found: error
          compression-level: 9
