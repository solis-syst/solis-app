name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare release
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Use the format v0.1.7"
            exit 1
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Set release version
        shell: bash
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist

      - name: Generate update metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "Solis Setup $env:RELEASE_VERSION.exe" -File | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer for version $env:RELEASE_VERSION was not found."
            exit 1
          }

          $blockmap = Get-Item "$($installer.FullName).blockmap" -ErrorAction SilentlyContinue
          if (-not $blockmap) {
            Write-Error "Installer blockmap was not found: $([$installer.FullName]).blockmap"
            exit 1
          }

          $hash = [System.Security.Cryptography.SHA512]::Create()
          try {
            $stream = [System.IO.File]::OpenRead($installer.FullName)
            try {
              $sha512 = [Convert]::ToBase64String($hash.ComputeHash($stream))
            } finally {
              $stream.Dispose()
            }
          } finally {
            $hash.Dispose()
          }

          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $latest = @"
version: $env:RELEASE_VERSION
files:
  - url: $($installer.Name)
    sha512: $sha512
    size: $($installer.Length)
path: $($installer.Name)
sha512: $sha512
releaseDate: $releaseDate
"@

          Set-Content -Path "dist/latest.yml" -Value $latest -Encoding utf8

          "INSTALLER=$($installer.FullName)" >> $env:GITHUB_ENV
          "BLOCKMAP=$($blockmap.FullName)" >> $env:GITHUB_ENV

      - name: Publish update repository release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOLIS_RELEASE_TOKEN }}
        run: |
          UPDATE_REPO="solis-syst/solis-app-updates"

          if gh release view "$RELEASE_TAG" --repo "$UPDATE_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refreshing its assets."
            gh release upload "$RELEASE_TAG" "$INSTALLER" "$BLOCKMAP" "dist/latest.yml" --repo "$UPDATE_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$UPDATE_REPO" --title "$RELEASE_VERSION" --latest
          else
            echo "Creating published release $RELEASE_TAG."
            gh release create "$RELEASE_TAG" "$INSTALLER" "$BLOCKMAP" "dist/latest.yml" --repo "$UPDATE_REPO" --title "$RELEASE_VERSION" --latest --target main
          fi
