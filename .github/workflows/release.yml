name: Release Solis

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare release tag
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Use the format v0.1.1"
            exit 1
          fi

          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "Tag $TAG already exists."
              echo "Use a different version tag."
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Prepare update repository tag
        shell: bash
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.SOLIS_RELEASE_TOKEN }}
        run: |
          UPDATE_REPO="https://github.com/solis-syst/solis-app-updates.git"

          if git ls-remote --exit-code --refs "$UPDATE_REPO" "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Update repository tag $RELEASE_TAG already exists."
          else
            git fetch --no-tags --depth=1 "$UPDATE_REPO" "refs/heads/main:refs/remotes/update/main"
            git tag "$RELEASE_TAG" "refs/remotes/update/main"
            git -c "http.extraheader=AUTHORIZATION: bearer $GITHUB_RELEASE_TOKEN" push "$UPDATE_REPO" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi

      - name: Set release version
        shell: bash
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        run: npm run release
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.SOLIS_RELEASE_TOKEN }}
