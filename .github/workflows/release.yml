name: Release Solis

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Use the format v0.1.1"
            exit 1
          fi

          if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Source tag $TAG exists. Continuing release."
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
            echo "Created source tag $TAG."
          else
            echo "Source tag $TAG is missing for a tag-triggered release."
            exit 1
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Prepare update repository tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOLIS_RELEASE_TOKEN }}
        run: |
          UPDATE_REPO="solis-syst/solis-app-updates"

          if gh api --silent "repos/$UPDATE_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Update repository tag $RELEASE_TAG exists. Continuing release."
          else
            UPDATE_SHA=$(gh api "repos/$UPDATE_REPO/git/ref/heads/main" --jq ".object.sha")
            gh api "repos/$UPDATE_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$UPDATE_SHA" >/dev/null
            echo "Created update repository tag $RELEASE_TAG."
          fi

      - name: Set release version
        shell: bash
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        run: npm run release
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.SOLIS_RELEASE_TOKEN }}
