<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solis</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <p class="eyebrow">SOLIS</p>
        <h1>Chess analysis, rebuilt for Electron.</h1>
        <p class="subtitle">Local engines, a managed chess browser, and automatic updates in one desktop app. UI update test build.</p>
      </div>
      <div class="status">
        <span class="dot"></span>
        Electron ready
      </div>
    </section>

    <section class="panel">
      <h2>Browser</h2>
      <p>Open a chess site inside the Solis browser window.</p>
      <div class="actions">
        <button id="chesscom">Open Chess.com</button>
        <button id="lichess">Open Lichess</button>
      </div>
      <p id="message" class="message"></p>
    </section>

    <section class="panel">
      <h2>Updates</h2>
      <p id="update-status" class="message">Checking updater status...</p>
      <button id="install-update" hidden>Restart and install update</button>
    </section>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
